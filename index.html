<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Machine Alert</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#c00;
    color:white;
}

#btn{
    width:320px;
    height:320px;
    border-radius:50%;
    border:none;
    font-size:70px;
    font-weight:bold;
    color:white;
    cursor:pointer;
}

#status{
    font-size:100px;
    font-weight:bold;
    text-align:center;
}
</style>
</head>

<body>

<div id="app"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    get,
    onValue
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyCZ8PWnHPohUmeknuXAXCp159em0MZHP3g",
    authDomain: "motor-9581e.firebaseapp.com",
    databaseURL: "https://motor-9581e-default-rtdb.asia-southeast1.firebasedatabase.app/",
    projectId: "motor-9581e",
    storageBucket: "motor-9581e.firebasestorage.app",
    messagingSenderId: "207459218961",
    appId: "1:207459218961:web:e4f20cc17db2a7a2a8e3b0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const appDiv = document.getElementById("app");

const isAlertPage = location.hash === "#alert";

const siren = new Audio(
"https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"
);

siren.loop = true;

/* ==================================
   CONTROL PAGE
================================== */

if(!isAlertPage){

    appDiv.innerHTML = `
        <button id="btn">OFF</button>
    `;

    const btn = document.getElementById("btn");

    onValue(ref(db,"machineState"),(snapshot)=>{

        const state = snapshot.val() || false;

        btn.textContent = state ? "ON" : "OFF";

        btn.style.background =
            state ? "green" : "red";

        document.body.style.background =
            state ? "#006600" : "#990000";

    });

    btn.addEventListener("click", async ()=>{

        try{

            const snap =
                await get(ref(db,"machineState"));

            const current =
                snap.val() || false;

            await set(
                ref(db,"machineState"),
                !current
            );

        }catch(err){

            console.error(err);
            alert(err.message);

        }

    });

}

/* ==================================
   ALERT PAGE
================================== */

else{

    appDiv.innerHTML = `
        <div id="status">OFF</div>
    `;

    const status =
        document.getElementById("status");

    let previousState = null;
    let alarmTimer = null;

    function stopAlarm(){

        siren.pause();
        siren.currentTime = 0;

        if(alarmTimer){
            clearTimeout(alarmTimer);
            alarmTimer = null;
        }

    }

    function startAlarm(){

        stopAlarm();

        siren.currentTime = 0;

        siren.play().catch(err=>{
            console.log(err);
        });

        alarmTimer = setTimeout(()=>{
            stopAlarm();
        },60000);

    }

    document.body.addEventListener(
        "click",
        stopAlarm
    );

    onValue(ref(db,"machineState"),(snapshot)=>{

        const state =
            snapshot.val() || false;

        status.textContent =
            state ? "ON" : "OFF";

        document.body.style.background =
            state ? "green" : "red";

        if(
            previousState !== null &&
            previousState !== state
        ){
            startAlarm();
        }

        previousState = state;

    });

}

</script>

</body>
</html>
